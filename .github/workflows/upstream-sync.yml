name: Upstream sync watch

on:
  schedule:
    - cron: '17 19 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest

    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/tonygoldcrest/sightkick.git
          git fetch upstream main --tags

      - name: Compare histories
        id: compare
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const ahead = Number(git('rev-list', '--count', 'HEAD..upstream/main'));
          const latestTag = git('tag', '--merged', 'upstream/main', '--sort=-version:refname', '--format=%(refname:short)').split('\n')[0] || '';
          let tagMissing = false;
          if (latestTag) {
            try {
              execFileSync('git', ['merge-base', '--is-ancestor', latestTag, 'HEAD']);
            } catch {
              tagMissing = true;
            }
          }
          const output = [
            `ahead=${ahead}`,
            `latest_tag=${latestTag}`,
            `latest_sha=${git('rev-parse', '--short=12', 'upstream/main')}`,
            `tag_missing=${tagMissing}`,
            `update_available=${ahead > 0 || tagMissing}`,
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `${output}\n`);
          NODE

      - name: Open upstream update issue
        if: steps.compare.outputs.update_available == 'true'
        uses: actions/github-script@v7
        env:
          AHEAD: ${{ steps.compare.outputs.ahead }}
          LATEST_TAG: ${{ steps.compare.outputs.latest_tag }}
          LATEST_SHA: ${{ steps.compare.outputs.latest_sha }}
          TAG_MISSING: ${{ steps.compare.outputs.tag_missing }}
        with:
          script: |
            const marker = '<!-- sightkick-upstream-sync -->';
            const title = `Upstream sync available: ${process.env.LATEST_TAG || process.env.LATEST_SHA}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const body = `${marker}\n\nUpstream \`tonygoldcrest/sightkick\` has ${process.env.AHEAD} commit(s) beyond this fork's default branch.\n\n- latest upstream tag: \`${process.env.LATEST_TAG || 'none'}\`\n- upstream main: \`${process.env.LATEST_SHA}\`\n- latest tag missing locally: \`${process.env.TAG_MISSING}\`\n\nReview and merge manually; this workflow never changes code.`;
            const existing = issues.find((issue) => issue.body?.includes(marker));
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
