name: Test

on:
  push:
    paths:
      - 'package.json'
      - 'yarn.lock'
      - 'electron.vite.config.ts'
      - 'scripts/**'
      - 'assets/**'
      - 'src/main/**'
      - 'src/preload/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'package.json'
      - 'yarn.lock'
      - 'electron.vite.config.ts'
      - 'scripts/**'
      - 'assets/**'
      - 'src/main/**'
      - 'src/preload/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      # Drumroll ships one artifact: the macOS arm64 DMG. The win/linux
      # electron-builder targets are upstream leftovers and cannot package the
      # bundled lesson library as-is (lesson titles carry characters that are
      # illegal in Windows paths), so this gate proves the target that ships.
      matrix:
        include:
          - os: macos-latest
            package_cmd: yarn package

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      # The lesson-library generator runs through uv (see
      # web/scripts/package-lessons.mjs); every packaging target needs it.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      # The lesson-library generator encodes click tracks with ffmpeg.
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ffmpeg

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y

      - name: Install dependencies
        run: yarn install

      - name: Build and package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ${{ matrix.package_cmd }}
