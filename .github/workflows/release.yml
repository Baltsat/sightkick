name: Release

on:
  push:
    tags:
      - 'v*-kb.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-mac-arm64:
    runs-on: macos-14
    env:
      GH_TOKEN: ${{ github.token }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e 'const p=require("./package.json");if(process.env.GITHUB_REF_NAME!==`v${p.version}`)throw new Error(`tag ${process.env.GITHUB_REF_NAME} does not match package version ${p.version}`)'

      - name: Configure optional signing
        env:
          SIGNING_CSC_LINK: ${{ secrets.CSC_LINK }}
          SIGNING_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          SIGNING_APPLE_ID: ${{ secrets.APPLE_ID }}
          SIGNING_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SIGNING_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -n "$SIGNING_CSC_LINK" ]]; then echo "CSC_LINK=$SIGNING_CSC_LINK" >> "$GITHUB_ENV"; fi
          if [[ -n "$SIGNING_CSC_KEY_PASSWORD" ]]; then echo "CSC_KEY_PASSWORD=$SIGNING_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"; fi
          if [[ -n "$SIGNING_APPLE_ID" ]]; then echo "APPLE_ID=$SIGNING_APPLE_ID" >> "$GITHUB_ENV"; fi
          if [[ -n "$SIGNING_APPLE_APP_SPECIFIC_PASSWORD" ]]; then echo "APPLE_APP_SPECIFIC_PASSWORD=$SIGNING_APPLE_APP_SPECIFIC_PASSWORD" >> "$GITHUB_ENV"; fi
          if [[ -n "$SIGNING_APPLE_TEAM_ID" ]]; then echo "APPLE_TEAM_ID=$SIGNING_APPLE_TEAM_ID" >> "$GITHUB_ENV"; fi

      - name: Report signing mode
        run: |
          if [[ -n "$CSC_LINK" && -n "$APPLE_ID" && -n "$APPLE_APP_SPECIFIC_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            echo "signed and notarized macOS release"
          else
            echo "::notice::Apple signing secrets are incomplete; publishing an unsigned macOS release"
          fi

      - name: Type check
        run: yarn typecheck

      - name: Build and publish
        run: yarn build && yarn electron-builder build --mac --arm64 --publish always

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sightkick-macos-arm64-${{ github.ref_name }}
          path: |
            release/build/*.dmg
            release/build/*.dmg.blockmap
            release/build/*.zip
            release/build/*.zip.blockmap
            release/build/*-mac.yml
          if-no-files-found: error
