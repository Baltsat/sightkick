[project]
name = "sk-transcriber"
version = "0.1.0"
description = "SightKick Transcriber — turns a YouTube URL or local audio file into a Clone Hero style drum-chart song folder."
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
  # --- YouTube download ---
  "yt-dlp==2026.7.4",
  # --- core numerics / audio I/O ---
  "numpy==2.4.6",
  "scipy==1.18.0",
  "soundfile==0.14.0",
  "librosa==0.11.0",
  # --- MIDI writing ---
  "mido==1.3.3",
  # --- beat/downbeat tracking (CP-JKU Beat This!, MIT licensed) ---
  "beat-this==1.1.0",
  "torch==2.13.0",
  "torchaudio==2.11.0",
  # --- stem separation fallback when --stems-bin is not supplied ---
  "demucs==4.1.0",
  # --- misc ---
  "requests==2.34.2",
]

[tool.uv]
# This tool targets Apple Silicon macOS only (see run.sh / README). Restrict
# the lock resolution to that platform — otherwise uv tries to also satisfy
# x86_64 macOS wheel constraints (e.g. demucs pinning numpy<2 there) which
# conflicts with the arm64 resolution and makes locking impossible.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
# Keep resolution reproducible; the exact versions above were resolved and
# verified working on Apple Silicon (macOS, Python 3.12.11) on 2026-08-05.
