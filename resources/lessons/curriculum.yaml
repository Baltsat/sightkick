# Generated by build_curriculum.py (authoring-time only; not part of the shipped generator).
# Rudiment Gym units (Fundamentals wing) added by a later authoring-time pass (build_fundamentals.py / splice_and_renumber.py, also not part of the shipped generator) -- see README.md's "Rudiment Gym" section for the design writeup and PAS-40 coverage table.
meta:
  title: SightKick Method - Drumset Fundamentals
  inspiration: Pedagogical progression inspired by a well-known beginner drumset method book's lesson
    order (sticking basics, reading, coordination, 8th notes, toms, ties/rests, strokes, fills, musical
    form, 16th notes, triplets, jazz, shuffle, new meters). Rudiments (paradiddle, single strokes) and
    standard beat vocabulary (rock, shuffle, jazz ride, waltz) are traditional material. All exercise
    titles, coaching cues, and the specific note patterns below are original work, not transcriptions
    of the book's engravings.
  notation_legend:
    lanes:
      K: kick
      S: snare
      H: hi-hat, closed
      O: hi-hat, open
      R: ride cymbal
      C: crash cymbal
      T1: high tom
      T2: mid tom
      T3: floor tom
    symbols:
      .: rest
      x: normal hit
      X: accent
      g: ghost note; also reused for cross-stick in ballad-style exercises (09.05, 09.06) since the format
        has no dedicated cross-stick symbol -- distinguishable only via the exercise's coaching cue, not
        in the generated chart
      o: open-hihat color hit at normal velocity, written within a lane's own step string (in this curriculum,
        always the H lane) instead of switching to the O lane -- useful when one pattern mixes open and
        closed hi-hat within the same bar (e.g. a shuffle groove where the foot opens and closes mid-pattern,
        see 10.10/21.07/21.08). MIDI-wise it is identical to a closed hit on the same lane -- Clone Hero's
        pro-drums vocabulary has no distinct open-hat note (see README.md's MIDI mapping section) -- but
        generate.py's drums.ogg renderer swaps in the vendored hihat_open.wav sample for 'o' events specifically,
        so the audible demo is distinguishable from a closed hit even though the chart data is not.
      '1': pp (pianissimo), graded-dynamics tier -- velocity 30
      '2': p (piano), graded-dynamics tier -- velocity 45
      '3': mp (mezzo-piano), graded-dynamics tier -- velocity 60
      '4': mf (mezzo-forte), graded-dynamics tier -- velocity 80
      '5': f (forte), graded-dynamics tier -- velocity 100
      '6': ff (fortissimo), graded-dynamics tier -- velocity 115, the same loudness as the accent symbol
        X
    graded_dynamics: Symbols '1'-'6' (pp/p/mp/mf/f/ff) are a six-step dynamics tier layered on top of
      the original four-symbol notation ('.'/'x'/'X'/'g'). They are used only on the handful of exercises
      where the book gives a genuine multi-step dynamic arc, not a binary loud/soft contrast -- 07.01,
      07.05, 07.06, 11.04, 12.02 (the Lesson 10 capstone), and 25.01/25.02 (the two Encore etudes). Every
      other exercise keeps the original binary x/X/g dynamics. The tier is deliberately velocity-compatible
      with the judge's existing accent/ghost thresholds in src/renderer/services/engine/constants.ts (ACCENT_VALUE_THRESHOLD=90,
      GHOST_VALUE_THRESHOLD=50) -- f/ff (100/115) clear the accent threshold the same way X (115) always
      has, and pp/p (30/45) clear the ghost threshold the same way g (40) always has.
    step_resolution: Each lane's value is a string, one character per step. A bar's step count is the
      string length and may differ bar to bar (e.g. 8 steps for 8th notes, 16 for 16ths, 12 for 8th-note
      triplets in 4/4). All lanes within one bar must share the same step count.
    tom_vs_cymbal: H/O share MIDI note 98 with T1, R shares note 99 with T2, and C shares note 100 with
      T3. generate.py emits a short tom-marker note (110/111/112) tightly scoped to each individual T1/T2/T3
      hit, so a cymbal lane and its matching tom lane may freely be used in different bars or at different
      steps of the same exercise. The one thing that's never allowed is a cymbal hit and a tom hit landing
      on the exact same step of the exact same pad -- generate.py raises an error if it finds one, since
      a single pad can't be both voices at once.
  midi_notes:
    K: 96
    S: 97
    H: 98
    O: 98
    T1: 98
    R: 99
    T2: 99
    C: 100
    T3: 100
  tom_marker_notes:
    T1: 110
    T2: 111
    T3: 112
  velocities:
    accent: 115
    normal: 96
    ghost: 40
    pp: 30
    p: 45
    mp: 60
    mf: 80
    f: 100
    ff: 115
  ticks_per_quarter: 480
  gamification:
    stars_to_unlock: Recommended minimum total stars earned (across all prior exercises) before this one
      unlocks. Computed as the exercise's 0-based position in the full curriculum order, so unlocking
      is a simple linear chain a future UI can widen (e.g. allow skipping ahead once N stars are banked).
    next: id of the next exercise in the recommended play order, or null for the last exercise.
  skills_legend:
    kick-independence: kick drum plays independently of / alongside the hands
    hihat-timekeeping: hi-hat or ride carries a steady timekeeping pulse
    eighth-notes: uses 8th-note step resolution in at least one bar
    sixteenth-notes: uses 16th-note step resolution in at least one bar
    triplet-feel: uses a triplet/compound subdivision in at least one bar
    compound-meter: written in a compound time signature (6/8, 9/8, 12/8)
    new-meter: written in a meter other than 4/4
    dynamics: uses the graded 1-6 (pp-ff) dynamics tier
    accents: uses the accent (X) symbol
    ghost-notes: uses the ghost-note (g) symbol
    cross-stick: cue calls for a cross-stick voicing on the snare
    open-hihat: uses the open-hihat color hit or the O lane
    toms: uses at least one tom lane (T1/T2/T3)
    fills: title or cue describes a fill
    crash: uses the crash lane
    ride: uses the ride lane
    shuffle-feel: title, cue, or lesson name identifies a shuffle feel
    jazz-ride: jazz-lesson context or cue references a ride pattern
    reading: early notation-reading fundamentals
    musical-form: addresses song form / arrangement (intro-verse-chorus, etc)
    capstone: a lesson-ending or Encore capstone piece
    waltz: a 3/4 waltz feel
    cut-time: written in 2/2 cut time
    paradiddle: uses paradiddle-family sticking (any of the 4 variants)
    single-paradiddle: single paradiddle rudiment (RLRR LRLL)
    double-paradiddle: double paradiddle rudiment (RLRLRR LRLRLL)
    triple-paradiddle: triple paradiddle rudiment (RLRLRLRR LRLRLRLL)
    paradiddle-diddle: paradiddle-diddle rudiment (RLRRLL LRLLRR)
    single-stroke-roll: single stroke roll rudiment (RLRL...)
    double-stroke-roll: double stroke roll rudiment (RRLL...)
    triple-stroke-roll: triple stroke roll rudiment (RRRLLL...)
    measured-roll: a measured (written-out, non-buzzed) long roll rudiment
    five-stroke-roll: five stroke roll rudiment
    six-stroke-roll: six stroke roll rudiment
    seven-stroke-roll: seven stroke roll rudiment
    nine-stroke-roll: nine stroke roll rudiment
    hand-to-foot: a hand sticking pattern with notes substituted onto the kick
    linear-drumming: no two lanes ever hit on the same step (linear voicing)
    hemiola: an accent or grouping pattern that crosses the notated meter
    singles: single-stroke technique focus
    doubles: double-stroke technique focus
    triples: triple-stroke technique focus
    tempo-building: one rung of a same-pattern, rising-tempo ladder
    rudiment-application: a rudiment placed in a groove or fill context
  rudiment_coverage:
    included:
    - single stroke roll
    - double stroke roll
    - triple stroke roll
    - single paradiddle
    - double paradiddle
    - triple paradiddle
    - paradiddle-diddle
    - five stroke roll
    - six stroke roll
    - seven stroke roll
    - nine stroke roll
    - accent studies (every-4th, every-3rd)
    - hand-to-foot combinations
    excluded:
      ? all 11 flam rudiments (flam, flam accent, flam tap, flamacue, flam paradiddle, single flammed
        mill, flam paradiddle-diddle, pataflafla, swiss army triplet, inverted flam tap, flam drag)
      : a flam is a grace note landing under ~30ms before its primary note; the notation grid has no sub-step
        timing offset (see README's existing flam caveat), so no flam rudiment can be honestly notated
      ? 'all 10 drag/ratamacue rudiments (drag, single/double drag tap, lesson 25, single dragadiddle,
        drag paradiddle #1/#2, single/double/triple ratamacue)'
      : drags are grace-note ornaments, same sub-step timing problem as flams
      multiple bounce roll (buzz roll): a sustained, uncontrolled-bounce roll has no discrete-hit representation
        in a grid where every step is a fixed-duration attack -- same category of gap as the README's
        existing fermata caveat
      ten/eleven/thirteen/fifteen/seventeen-stroke rolls: same measured-roll technique as the five/six/seven/nine-stroke
        rolls that are included; left out only to keep this wing's exercise count in the requested +40-60
        range, not for any notation-format reason
    notation_caveat: 'the grid has no lane concept of ''which hand'' -- a single S-lane hit sounds identical
      regardless of which hand plays it. Two consequences: (1) single/double/triple stroke rolls with
      the same hit density render as byte-identical audio, differentiated only by the cue text''s sticking
      notation; (2) double paradiddle and paradiddle-diddle share an accent skeleton (accent-then-5-unaccented,
      twice a bar) and are genuinely indistinguishable in the generated chart/audio, again differentiated
      only by the cue.'
