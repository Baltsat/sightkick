<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      /* exact values copied from src/renderer/styles/theme.css */
      :root {
        --surface-canvas: #f4efe5;
        --line-soft: #d9cebd;
        --color-ink: #111722;
        --color-text: #111722;
        --font-display: "Newsreader", Georgia, serif;
      }
      body {
        margin: 0;
        background: #ffffff;
        font-family: sans-serif;
      }

      /* exact rules copied from src/renderer/components/AppShell/AppShell.css */
      .arena-shell__rail {
        position: relative;
        z-index: 5;
        display: flex;
        width: 13rem;
        flex: 0 0 13rem;
        flex-direction: column;
        padding: 1.25rem 0.75rem 1rem;
        border-right: 1px solid var(--line-soft);
        background: var(--surface-canvas);
        box-shadow: none;
      }
      .arena-shell__brand {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        padding: 0.45rem 0.55rem 1.2rem;
        border: 0;
        color: var(--color-ink);
        background: transparent;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .arena-shell__brand-name {
        font-family: var(--font-display);
        font-size: 1.4rem;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.04em;
      }
      .arena-shell__brand-mark {
        display: grid;
        overflow: hidden;
        width: 2rem;
        height: 2rem;
        flex: 0 0 auto;
        place-items: center;
        border: 0;
        border-radius: 50%;
        background: transparent;
        box-shadow: none;
      }
      .arena-shell__brand-mark img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* proof-page scaffolding only, not app CSS */
      .zoom-row {
        display: flex;
        align-items: center;
        gap: 2rem;
        padding: 2rem;
        background: #fff;
      }
      .zoom-row .arena-shell__brand-mark {
        transform: scale(4);
        transform-origin: left center;
        margin-right: 4rem;
      }
      .label {
        font: 12px/1.4 monospace;
        color: #333;
      }
    </style>
  </head>
