<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="squircleC">
      <rect x="0" y="0" width="1024" height="1024" rx="225" ry="225" />
    </clipPath>

    <radialGradient id="fieldC" cx="62%" cy="58%" r="95%">
      <stop offset="0%" stop-color="#fef2da" />
      <stop offset="40%" stop-color="#f3dba3" />
      <stop offset="100%" stop-color="#c88f45" />
    </radialGradient>

    <linearGradient id="topGlossC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="bottomVignetteC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="60%" stop-color="#241f19" stop-opacity="0" />
      <stop offset="100%" stop-color="#241f19" stop-opacity="0.18" />
    </linearGradient>

    <linearGradient id="stickFillC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a392a" />
      <stop offset="100%" stop-color="#1d160f" />
    </linearGradient>

    <radialGradient id="burstCoreC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffaf0" />
      <stop offset="35%" stop-color="#fbd94f" />
      <stop offset="100%" stop-color="#e85a36" />
    </radialGradient>

    <radialGradient id="burstGlowC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbd94f" stop-opacity="0.85" />
      <stop offset="55%" stop-color="#f0913f" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f0913f" stop-opacity="0" />
    </radialGradient>
  </defs>

  <g clip-path="url(#squircleC)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#fieldC)" />

    <!-- concentric ember ripples from the strike point -->
    <g fill="none" stroke-linecap="round">
      <circle cx="562" cy="530" r="360" stroke="#e85a36" stroke-width="20" stroke-opacity="0.30" />
      <circle cx="562" cy="530" r="270" stroke="#ef8a3f" stroke-width="26" stroke-opacity="0.42" />
      <circle cx="562" cy="530" r="184" stroke="#f4bd3d" stroke-width="32" stroke-opacity="0.60" />
    </g>

    <!-- drumstick, diagonal, tip at the impact point -->
    <path d="M 148 936
             C 128 956 128 986 148 1004
             C 168 1022 198 1020 216 1000
             L 592 566
             L 534 512
             Z" fill="url(#stickFillC)" />
    <circle cx="172" cy="968" r="58" fill="url(#stickFillC)" />
    <path d="M 172 968 m -58 0 a 58 58 0 1 0 116 0 a 58 58 0 1 0 -116 0"
          fill="#000000" fill-opacity="0.1" />

    <!-- impact burst -->
    <circle cx="562" cy="530" r="210" fill="url(#burstGlowC)" />
    <path d="M 562 420
             L 588 500
             L 668 480
             L 602 528
             L 656 592
             L 574 560
             L 562 646
             L 550 560
             L 468 592
             L 522 528
             L 456 480
             L 536 500
             Z" fill="url(#burstCoreC)" />
    <circle cx="562" cy="530" r="38" fill="#fffaf0" />

    <rect x="0" y="0" width="1024" height="1024" fill="url(#topGlossC)" />
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bottomVignetteC)" />
  </g>
</svg>
