<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    Small-size variant of the "Signal Disc" mark, used only for the
    16 px and 32 px iconset/ico slots. Same composition as the master,
    hand-simplified so it survives a 16 px raster: rim lugs and the thin
    gold hairline are dropped (both are sub-pixel noise below 64 px), the
    drop shadow is removed (it just reads as haze at this size), and the
    ring + waveform strokes are thickened so the silhouette stays a
    confident dark ring with a bright ember spike instead of thinning
    into a grey smear. See assets/ICON_PROVENANCE.md.
  -->
  <defs>
    <clipPath id="squircleBS">
      <rect x="0" y="0" width="1024" height="1024" rx="225" ry="225" />
    </clipPath>

    <radialGradient id="fieldBS" cx="40%" cy="32%" r="90%">
      <stop offset="0%" stop-color="#fef6e6" />
      <stop offset="48%" stop-color="#f3dda8" />
      <stop offset="100%" stop-color="#cf9a4c" />
    </radialGradient>

    <radialGradient id="discFillBS" cx="46%" cy="36%" r="72%">
      <stop offset="0%" stop-color="#fffdf7" />
      <stop offset="100%" stop-color="#efddb6" />
    </radialGradient>

    <linearGradient id="waveGradBS" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e85a36" />
      <stop offset="40%" stop-color="#f0913f" />
      <stop offset="50%" stop-color="#f9d84e" />
      <stop offset="60%" stop-color="#f0913f" />
      <stop offset="100%" stop-color="#e85a36" />
    </linearGradient>
  </defs>

  <g clip-path="url(#squircleBS)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#fieldBS)" />

    <circle cx="512" cy="512" r="400" fill="url(#discFillBS)" />
    <circle cx="512" cy="512" r="400" fill="none" stroke="#241f19" stroke-width="72" />

    <path d="M 210 512
             L 400 512
             C 432 512 440 400 468 350
             C 488 314 500 300 512 296
             C 524 300 536 314 556 350
             C 584 400 592 512 624 512
             L 814 512"
          fill="none" stroke="url(#waveGradBS)" stroke-width="46"
          stroke-linecap="round" stroke-linejoin="round" />

    <circle cx="512" cy="296" r="24" fill="#fff8e6" />
  </g>
</svg>
